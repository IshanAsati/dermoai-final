[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dermoai-local"
version = "0.1.0"
description = "Local research training and Label Studio integration"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.6.0", "torchvision==0.21.0", "timm>=1.0.15,<1.1",
  "label-studio-sdk>=2,<3", "Flask>=3,<4", "waitress>=3,<4",
  "semver~=3.0.2", "colorama>=0.4,<0.5", "requests>=2.32,<3",
  "scikit-learn>=1.6,<2", "scipy>=1.15,<2", "matplotlib>=3.9,<4", "Pillow>=11,<13",
  "filelock>=3.16,<4", "psutil>=6,<8", "kagglehub>=0.3,<1"
]

[project.scripts]
dermoai = "dermoai.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dermoai*"]
